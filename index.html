<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diddle Stock Beta</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        h1 { color: #007bff; text-align: center; }
        #loading { text-align: center; font-size: 1.2em; color: #666; margin-top: 50px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background-color: #e0e0e0; font-weight: bold; border-radius: 5px; transition: background 0.3s, color 0.3s; }
        .tab-btn.active { background-color: #007bff; color: white; }
        .table-container { overflow-x: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 0.95em; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <h1>Diddle Stock Beta</h1>
    <div id="loading">Chargement des onglets et des stocks en cours...</div>
    
    <div class="tabs" id="tabs-container"></div>
    <div class="table-container" id="table-container"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwsMujiMbV3ubiXgzfajPtQ_jpYas9uaWoPLj2zh8IX-IUsQ5DqW0LUtZa6EDqr7yBO/exec";
        
        let allData = {};
        let currentTab = "";

        async function fetchStockData() {
            try {
                const response = await fetch(SCRIPT_URL);
                allData = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                const sheetNames = Object.keys(allData);
                if (sheetNames.length > 0) {
                    currentTab = sheetNames[0]; // Sélectionne le premier onglet par défaut
                    renderTabs(sheetNames);
                    renderTable(currentTab);
                } else {
                    document.getElementById('table-container').innerHTML = "<p>Aucun onglet trouvé dans le document.</p>";
                }
            } catch (error) {
                document.getElementById('loading').innerText = "Erreur lors du chargement des données.";
                console.error(error);
            }
        }

        function renderTabs(sheetNames) {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            sheetNames.forEach(name => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${name === currentTab ? 'active' : ''}`;
                btn.innerText = name;
                btn.onclick = () => {
                    currentTab = name;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderTable(currentTab);
                };
                container.appendChild(btn);
            });
        }

        function renderTable(sheetName) {
            const container = document.getElementById('table-container');
            const rows = allData[sheetName];
            
            if (!rows || rows.length === 0) {
                container.innerHTML = "<p>Cet onglet est vide.</p>";
                return;
            }

            let html = '<table>';
            rows.forEach((row, index) => {
                html += '<tr>';
                row.forEach(cell => {
                    if (index === 0) {
                        html += `<th>${cell !== "" ? cell : ''}</th>`;
                    } else {
                        html += `<td>${cell}</td>`;
                    }
                });
                html += '</tr>';
            });
            html += '</table>';
            container.innerHTML = html;
        }

        fetchStockData();
    </script>
</body>
</html>
